<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker - Post-Lab Practical 10</title>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between p-4 md:p-8">

  <!-- Header Banner -->
  <header class="max-w-5xl mx-auto w-full text-center mb-8">
    <span class="bg-indigo-500/10 text-indigo-400 text-xs font-bold uppercase tracking-widest px-3.5 py-1.5 rounded-full border border-indigo-500/20">
      Post-Lab Practical 10
    </span>
    <h1 class="text-3xl md:text-4xl font-extrabold text-white mt-3 tracking-tight">
      Student Expense Tracker
    </h1>
    <p class="text-slate-400 text-sm mt-1">
      Monitor daily spending, organize by category, and maintain persistent records.
    </p>
  </header>

  <!-- Main Dashboard Container -->
  <main class="max-w-5xl mx-auto w-full my-auto">
    
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- Left Column: Add Expense Form Card -->
      <div class="lg:col-span-5 bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-3xl p-6 md:p-8 shadow-2xl">
        <h2 class="text-lg font-bold text-white mb-4 border-b border-slate-800 pb-3 flex items-center gap-2">
          <span>➕</span> Add New Expense
        </h2>

        <form id="expenseForm" class="space-y-4" onsubmit="event.preventDefault(); addExpense();">
          
          <!-- Expense Title -->
          <div>
            <label for="expenseTitle" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Expense Title
            </label>
            <input 
              type="text" 
              id="expenseTitle" 
              placeholder="e.g. College Canteen" 
              class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 transition-all placeholder:text-slate-600"
            />
          </div>

          <!-- Expense Amount -->
          <div>
            <label for="expenseAmount" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Amount (₹)
            </label>
            <input 
              type="number" 
              id="expenseAmount" 
              min="1" 
              step="any"
              placeholder="e.g. 150" 
              class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 transition-all placeholder:text-slate-600"
            />
          </div>

          <!-- Expense Category -->
          <div>
            <label for="expenseCategory" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Category
            </label>
            <select 
              id="expenseCategory" 
              class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 transition-all"
            >
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Books">Books</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Alert Feedback -->
          <div id="formAlert" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-xl p-3"></div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-indigo-600/30 mt-2"
          >
            Add Expense
          </button>

        </form>
      </div>

      <!-- Right Column: Analytics & Expense Logs -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- Summary & Filter Banner -->
        <div class="bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-3xl p-6 shadow-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
          <div>
            <span class="text-xs uppercase font-semibold text-slate-400 block mb-1">Total Spent</span>
            <span id="totalSpent" class="text-3xl font-black text-emerald-400">₹0</span>
          </div>

          <!-- Category Filter Dropdown -->
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label for="categoryFilter" class="text-xs font-semibold text-slate-400 uppercase whitespace-nowrap">Filter:</label>
            <select 
              id="categoryFilter" 
              onchange="renderExpenses()" 
              class="w-full sm:w-auto bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-indigo-500 transition-all"
            >
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Books">Books</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Dynamic Expense Items List -->
        <div class="bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-3xl p-6 shadow-2xl min-h-[280px] flex flex-col justify-between">
          <div id="expenseList" class="space-y-3">
            <!-- Empty State -->
            <div id="emptyLogState" class="text-center py-12 text-slate-500">
              <span class="text-4xl block mb-2">💸</span>
              <p class="text-sm">No expenses recorded yet.</p>
            </div>
          </div>

          <!-- Footer Clear All Trigger -->
          <div class="pt-4 mt-4 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-500">
            <span id="recordCount">0 Records</span>
            <button onclick="clearAllExpenses()" class="hover:text-rose-400 transition-colors">Clear All History</button>
          </div>
        </div>

      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-600 mt-8">
    © 2026 S. B. Jain Institute of Technology, Management & Research, Nagpur
  </footer>

  <!-- Application Logic JavaScript -->
  <script>
    // 1. Initial State Retrieval from Local Storage
    let expenses = JSON.parse(localStorage.getItem('student_expenses')) || [];

    // Helper functions for category visual badges
    function getCategoryBadge(category) {
      switch(category) {
        case 'Food': return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        case 'Travel': return 'bg-sky-500/10 text-sky-400 border-sky-500/20';
        case 'Books': return 'bg-purple-500/10 text-purple-400 border-purple-500/20';
        default: return 'bg-slate-500/10 text-slate-400 border-slate-500/20';
      }
    }

    // 2. Add New Expense Logic[cite: 41, 42]
    function addExpense() {
      const titleInput = document.getElementById('expenseTitle');
      const amountInput = document.getElementById('expenseAmount');
      const categoryInput = document.getElementById('expenseCategory');
      const formAlert = document.getElementById('formAlert');

      const title = titleInput.value.trim();
      const amount = parseFloat(amountInput.value);
      const category = categoryInput.value;

      // Validation Checks
      if (title === '' || isNaN(amount) || amount <= 0) {
        formAlert.textContent = "Please enter a valid expense title and positive amount.";
        formAlert.classList.remove('hidden');
        return;
      }
      formAlert.classList.add('hidden');

      // Build New Expense Object
      const newExpense = {
        id: Date.now(),
        title: title,
        amount: amount,
        category: category
      };

      // Store, Save & Reset[cite: 41]
      expenses.push(newExpense);
      saveToLocalStorage();
      renderExpenses();

      titleInput.value = '';
      amountInput.value = '';
    }

    // 3. Delete Single Expense[cite: 41, 42]
    function deleteExpense(id) {
      expenses = expenses.filter(item => item.id !== id);
      saveToLocalStorage();
      renderExpenses();
    }

    // Clear All Records
    function clearAllExpenses() {
      if (expenses.length === 0) return;
      if (confirm("Are you sure you want to clear all expense records?")) {
        expenses = [];
        saveToLocalStorage();
        renderExpenses();
      }
    }

    // 4. Local Storage Synchronization[cite: 41]
    function saveToLocalStorage() {
      localStorage.setItem('student_expenses', JSON.stringify(expenses));
    }

    // 5. DOM Rendering and Calculation[cite: 41, 42]
    function renderExpenses() {
      const expenseList = document.getElementById('expenseList');
      const filterValue = document.getElementById('categoryFilter').value;
      const totalSpent = document.getElementById('totalSpent');
      const recordCount = document.getElementById('recordCount');

      // Filter array based on dropdown selection[cite: 41]
      const filteredExpenses = filterValue === 'All' 
        ? expenses 
        : expenses.filter(item => item.category === filterValue);

      // Reset Container
      expenseList.innerHTML = '';

      if (filteredExpenses.length === 0) {
        expenseList.innerHTML = `
          <div id="emptyLogState" class="text-center py-12 text-slate-500">
            <span class="text-4xl block mb-2">💸</span>
            <p class="text-sm">No expenses found for this selection.</p>
          </div>
        `;
        totalSpent.textContent = '₹0';
        recordCount.textContent = '0 Records';
        return;
      }

      // Calculate Running Sum for Filtered Expenses[cite: 41]
      let grandTotal = 0;

      filteredExpenses.forEach(item => {
        grandTotal += item.amount;

        const card = document.createElement('div');
        card.className = "bg-slate-950/60 border border-slate-800/80 p-4 rounded-2xl flex items-center justify-between gap-3 hover:border-slate-700 transition-all";
        card.innerHTML = `
          <div class="flex flex-col">
            <span class="text-sm font-bold text-white">${item.title}</span>
            <span class="inline-block mt-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md border w-max ${getCategoryBadge(item.category)}">
              ${item.category}
            </span>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-base font-extrabold text-white">₹${item.amount.toFixed(2)}</span>
            <button 
              onclick="deleteExpense(${item.id})" 
              class="text-slate-500 hover:text-rose-400 font-bold text-lg px-2 py-1 rounded-lg hover:bg-rose-500/10 transition-all"
              title="Delete Expense"
            >
              ✕
            </button>
          </div>
        `;
        expenseList.appendChild(card);
      });

      // Update Summary UI[cite: 41]
      totalSpent.textContent = `₹${grandTotal.toFixed(2)}`;
      recordCount.textContent = `${filteredExpenses.length} Records Shown`;
    }

    // Initial DOM Build[cite: 41]
    renderExpenses();
  </script>

</body>
</html>
