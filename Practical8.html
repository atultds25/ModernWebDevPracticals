<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admission Portal - Registration Form</title>
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-950 via-slate-900 to-teal-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between p-4 md:p-8">

  <!-- Main Container -->
  <main class="max-w-xl mx-auto w-full my-auto">
    
    <!-- Title Header -->
    <div class="text-center mb-6">
      <span class="bg-emerald-500/10 text-emerald-400 text-xs font-bold uppercase tracking-widest px-3.5 py-1.5 rounded-full border border-emerald-500/20">
        Lab Practical 08
      </span>
      <h1 class="text-3xl font-extrabold text-white mt-3 tracking-tight">
        Student Registration
      </h1>
      <p class="text-slate-400 text-xs mt-1.5">
        Complete the registration form with valid credentials to apply for admission.
      </p>
    </div>

    <!-- Registration Card -->
    <div class="bg-slate-900/80 border border-slate-800 backdrop-blur-xl rounded-3xl p-6 md:p-8 shadow-2xl">
      <form id="registrationForm" class="space-y-4" novalidate>
        
        <!-- Full Name -->
        <div>
          <label for="fullName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
            Full Name
          </label>
          <input 
            type="text" 
            id="fullName" 
            value="Atul Tripathi"
            placeholder="e.g. Atul Tripathi" 
            class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500 transition-all placeholder:text-slate-600"
          />
          <span id="nameError" class="text-rose-400 text-xs mt-1 hidden block"></span>
        </div>

        <!-- Email Address -->
        <div>
          <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
            Email Address
          </label>
          <input 
            type="email" 
            id="email" 
            value="atultripathi@gmail.com"
            placeholder="e.g. atultripathi@gmail.com" 
            class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500 transition-all placeholder:text-slate-600"
          />
          <span id="emailError" class="text-rose-400 text-xs mt-1 hidden block"></span>
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
            Password (Min 8 characters)
          </label>
          <input 
            type="password" 
            id="password" 
            value="password123"
            placeholder="••••••••" 
            class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500 transition-all placeholder:text-slate-600"
          />
          <span id="passwordError" class="text-rose-400 text-xs mt-1 hidden block"></span>
        </div>

        <!-- Mobile Number -->
        <div>
          <label for="mobile" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
            Mobile Number (10 Digits)
          </label>
          <input 
            type="tel" 
            id="mobile" 
            value="1234567890"
            placeholder="e.g. 1234567890" 
            class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500 transition-all placeholder:text-slate-600"
          />
          <span id="mobileError" class="text-rose-400 text-xs mt-1 hidden block"></span>
        </div>

        <!-- Course Selection -->
        <div>
          <label for="course" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
            Course
          </label>
          <select 
            id="course" 
            class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-emerald-500 transition-all"
          >
            <option value="">Select a Course</option>
            <option value="CSE (Data Science)" selected>CSE (Data Science)</option>
            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
            <option value="Information Technology">Information Technology</option>
            <option value="AI & Machine Learning">AI & Machine Learning</option>
          </select>
          <span id="courseError" class="text-rose-400 text-xs mt-1 hidden block"></span>
        </div>

        <!-- Terms and Conditions Checkbox -->
        <div class="pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-xs text-slate-300">
            <input 
              type="checkbox" 
              id="terms" 
              checked
              class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0 focus:ring-offset-0"
            />
            <span>I agree to the terms and conditions</span>
          </label>
          <span id="termsError" class="text-rose-400 text-xs mt-1 hidden block"></span>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full bg-teal-700 hover:bg-teal-600 active:scale-95 text-white font-bold text-sm py-3 rounded-xl transition-all shadow-lg shadow-teal-900/40 mt-2"
        >
          Register
        </button>

        <!-- Global Success Message Banner -->
        <div id="successMessage" class="hidden text-center py-3 bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-sm font-semibold rounded-xl mt-3">
          Registration successful!
        </div>

      </form>
    </div>

  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-slate-600 mt-6">
    © 2026 S. B. Jain Institute of Technology, Management & Research, Nagpur
  </footer>

  <!-- JavaScript Validation Logic -->
  <script>
    // 1. DOM References
    const form = document.getElementById('registrationForm');
    const fullName = document.getElementById('fullName');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const mobile = document.getElementById('mobile');
    const course = document.getElementById('course');
    const terms = document.getElementById('terms');
    const successMessage = document.getElementById('successMessage');

    // Helper functions to show and hide inline field errors
    function showError(input, errorElement, message) {
      errorElement.textContent = message;
      errorElement.classList.remove('hidden');
      input.classList.add('border-rose-500');
      input.classList.remove('border-slate-700/80', 'border-emerald-500');
    }

    function clearError(input, errorElement) {
      errorElement.textContent = '';
      errorElement.classList.add('hidden');
      input.classList.remove('border-rose-500');
      input.classList.add('border-emerald-500');
    }

    // 2. Attach Submit Event Listener
    form.addEventListener('submit', function (e) {
      // Intercept default form submission
      e.preventDefault();

      let isValid = true;
      successMessage.classList.add('hidden');

      // 3. Mandatory Full Name Validation
      const nameVal = fullName.value.trim();
      if (nameVal === '') {
        showError(fullName, document.getElementById('nameError'), 'Full name is mandatory.');
        isValid = false;
      } else if (nameVal.length < 3) {
        showError(fullName, document.getElementById('nameError'), 'Name must be at least 3 characters.');
        isValid = false;
      } else {
        clearError(fullName, document.getElementById('nameError'));
      }

      // 4. Email Format Validation using RegEx
      const emailVal = email.value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (emailVal === '') {
        showError(email, document.getElementById('emailError'), 'Email address is mandatory.');
        isValid = false;
      } else if (!emailPattern.test(emailVal)) {
        showError(email, document.getElementById('emailError'), 'Please enter a valid email address.');
        isValid = false;
      } else {
        clearError(email, document.getElementById('emailError'));
      }

      // 5. Password Length Check
      const passVal = password.value;
      if (passVal === '') {
        showError(password, document.getElementById('passwordError'), 'Password is mandatory.');
        isValid = false;
      } else if (passVal.length < 8) {
        showError(password, document.getElementById('passwordError'), 'Password must be at least 8 characters long.');
        isValid = false;
      } else {
        clearError(password, document.getElementById('passwordError'));
      }

      // 6. Mobile Number RegEx Check (10 Digits)
      const mobileVal = mobile.value.trim();
      const mobilePattern = /^[0-9]{10}$/;
      if (mobileVal === '') {
        showError(mobile, document.getElementById('mobileError'), 'Mobile number is mandatory.');
        isValid = false;
      } else if (!mobilePattern.test(mobileVal)) {
        showError(mobile, document.getElementById('mobileError'), 'Please enter a valid 10-digit mobile number.');
        isValid = false;
      } else {
        clearError(mobile, document.getElementById('mobileError'));
      }

      // 7. Course Dropdown Selection Check
      if (course.value === '') {
        showError(course, document.getElementById('courseError'), 'Please select a course.');
        isValid = false;
      } else {
        clearError(course, document.getElementById('courseError'));
      }

      // 8. Terms Checkbox Verification
      if (!terms.checked) {
        document.getElementById('termsError').textContent = 'You must agree to the terms and conditions.';
        document.getElementById('termsError').classList.remove('hidden');
        isValid = false;
      } else {
        document.getElementById('termsError').textContent = '';
        document.getElementById('termsError').classList.add('hidden');
      }

      // 9. Display Success Banner
      if (isValid) {
        successMessage.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
